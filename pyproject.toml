[project]
name = "quant"
version = "0.1.0"
description = "SQLite-backed US equity portfolio and market analysis"
readme = "README.md"
authors = [
    { name = "George Anagnostou", email = "anagnostougeorgejohn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.5",
    "lxml>=6.1.2",
    "polars>=1.43.2",
    "pydantic>=2.10.3",
    "uvicorn[standard]>=0.32.1",
    "yfinance>=1.6.0",
]

[project.scripts]
quant = "quant.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
