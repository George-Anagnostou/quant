<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quant Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header>
      <div class="container nav">
        <a href="#/" class="brand">Quant Dashboard</a>
        <nav>
          <a href="#/">Watchlist</a>
          <a href="#/holdings">Holdings</a>
          <a href="#/screener">Screener</a>
        </nav>
        <form id="security-search" class="nav-search" role="search">
          <label class="sr-only" for="security-search-input">Find a security</label>
          <input
            id="security-search-input"
            type="search"
            placeholder="Find symbol or company"
            autocomplete="off"
          />
          <div id="security-search-results" class="search-results" hidden></div>
        </form>
      </div>
      <div
        id="market-strip"
        class="market-strip"
        role="status"
        aria-live="polite"
      ></div>
    </header>
    <main id="app" class="container"></main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
